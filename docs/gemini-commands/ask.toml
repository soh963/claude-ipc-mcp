# IPC Command for Gemini CLI

description = "💬 Send message and wait for response"
prompt = """
Send a message to another instance and wait for their response.

Target instance: {target}
Message: {message}
Timeout (seconds, default 30): {timeout}

!{uv run python %IPC_CHAT%\\tools\\ipc_global_command.py ask --to {target} "{message}" --timeout {timeout}}

This:
- Sends message to target instance
- Polls for response every second
- Returns response or timeout message
"""
