# IPC Command for Gemini CLI

description = "📤 Send message (fire and forget)"
prompt = """
Send a message without waiting for response.

Target instance: {args[0]}
Message: {args[1]}

!{uv run python D:/claude-ipc-mcp/tools/ipc_global_command.py chat --to {args[0]} "{args[1]}"}

This sends the message immediately and returns.
Use /ipc/ask if you need to wait for a response.
"""
