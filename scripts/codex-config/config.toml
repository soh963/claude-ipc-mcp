# Codex CLI - IPC Slash Commands Configuration
# Copy this file to %USERPROFILE%\.codex\config.toml
# or merge with your existing Codex configuration

# ================================================================================
# IPC Slash Commands - Project-Local Configuration
# ================================================================================
# IMPORTANT: Commands now use 'ipc' wrapper script which:
# 1. Auto-initializes .ipc in current project directory
# 2. Uses project-local settings from .ipc/config/project.json
# 3. No need for IPC_CHAT environment variable
# ================================================================================

# ================================================================================
# Slash Commands Definition (using ipc wrapper)
# ================================================================================

# 🚀 IPC Setup - One-click onboarding
[slash_commands."ipc:setup"]
command = "ipc register {args[0]} && ipc responder start {args[0]} --policy smart"
description = "🚀 Complete IPC setup (register + auto-responder)"
category = "ipc"
requires_args = 1
arg_names = ["instance_name"]
output_format = "json"

# 📊 IPC Status - Check connection
[slash_commands."ipc:status"]
command = "ipc status --json"
description = "📊 Check IPC connection status"
category = "ipc"
output_format = "json"

# 👥 IPC List - Show all instances
[slash_commands."ipc:list"]
command = "ipc instances list --full"
description = "👥 List all active instances"
category = "ipc"
output_format = "json"

# 💬 IPC Send - Send message
[slash_commands."ipc:send"]
command = "ipc ask --to {args[0]} \"{args[1]}\" --timeout 10"
description = "💬 Send message to another instance"
category = "ipc"
requires_args = 2
arg_names = ["to_instance", "message"]
output_format = "json"

# 📬 IPC Check - Check messages
[slash_commands."ipc:check"]
command = "ipc messages list --instance {args[0]}"
description = "📬 Check for new messages"
category = "ipc"
requires_args = 1
arg_names = ["instance_name"]
output_format = "json"

# 🤖 IPC Responder Start
[slash_commands."ipc:responder-start"]
command = "ipc responder start {args[0]} --policy {args[1]|smart}"
description = "🤖 Start auto-responder"
category = "ipc"
requires_args = 1
arg_names = ["instance_name", "policy"]
output_format = "json"

# 📊 IPC Responder Status
[slash_commands."ipc:responder-status"]
command = "ipc responder status {args[0]}"
description = "📊 Check responder status"
category = "ipc"
requires_args = 1
arg_names = ["instance_name"]
output_format = "json"

# 🛑 IPC Responder Stop
[slash_commands."ipc:responder-stop"]
command = "ipc responder stop {args[0]}"
description = "🛑 Stop auto-responder"
category = "ipc"
requires_args = 1
arg_names = ["instance_name"]
output_format = "json"

# 🏥 IPC Doctor - Diagnose and fix
[slash_commands."ipc:doctor"]
command = "ipc doctor --auto-fix"
description = "🏥 Diagnose and fix IPC issues"
category = "ipc"
output_format = "json"

# ================================================================================
# Environment Variables (Optional - auto-detected if not set)
# ================================================================================

[environment]
# These are now OPTIONAL - the ipc wrapper auto-detects them
# IPC_DB_PATH = "%USERPROFILE%\\.claude-ipc-data\\messages.db"
# IPC_HOST = "127.0.0.1"
# IPC_GLOBAL_PORT = "9876"

# ================================================================================
# Usage Examples (Project-Local Mode)
# ================================================================================

# Example 1: Initial Setup (registers instance + starts responder)
# /ipc:setup codex-main

# Example 2: Check Status (uses .ipc/config/project.json settings)
# /ipc:status

# Example 3: List Instances (shows all registered instances)
# /ipc:list

# Example 4: Send Message (new simplified syntax)
# /ipc:send claude-worker "Can you review this code?"

# Example 5: Check Messages
# /ipc:check codex-main

# Example 6: Start Auto-Responder
# /ipc:responder-start codex-main smart

# Example 7: Check Responder Status
# /ipc:responder-status codex-main

# Example 8: Stop Responder
# /ipc:responder-stop codex-main

# Example 9: Diagnose Issues
# /ipc:doctor

# ================================================================================
# Installation Instructions (Simplified for Project-Local Mode)
# ================================================================================

# 1. Ensure 'ipc' command is in PATH:
#    - Windows: Add D:\claude-ipc-mcp\scripts to PATH
#    - Or run: D:\claude-ipc-mcp\scripts\install-all-clis.sh

# 2. Copy this file to: %USERPROFILE%\.codex\config.toml
#    Or merge with your existing config.toml

# 3. Restart Codex CLI

# 4. Navigate to any project directory and run: /ipc:status
#    - This auto-creates .ipc/ in your project
#    - Uses project-local settings automatically

# ================================================================================
# Troubleshooting
# ================================================================================

# If commands don't work:
# 1. Verify 'ipc' command is in PATH: Run 'ipc status' from terminal
# 2. Check broker is running: /ipc:status
# 3. Run diagnostics: /ipc:doctor
# 4. Verify .ipc folder exists in your project directory
# 5. Check Codex logs for error messages

# ================================================================================
# Key Improvements
# ================================================================================

# ✅ No hardcoded paths - works from any project directory
# ✅ Auto-initialization - .ipc folder created automatically
# ✅ No environment variables needed - uses ipc wrapper script
# ✅ Project isolation - each project has own .ipc settings
# ✅ Simplified commands - shorter syntax using ipc aliases
